<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="8" y="8" width="112" height="112" rx="24" fill="url(#bgGrad)" stroke="#334155" stroke-width="2"/>

  <!-- Subtle Grid Lines -->
  <line x1="24" y1="44" x2="104" y2="44" stroke="#1e293b" stroke-dasharray="2 4" stroke-width="1"/>
  <line x1="24" y1="64" x2="104" y2="64" stroke="#1e293b" stroke-dasharray="2 4" stroke-width="1"/>
  <line x1="24" y1="84" x2="104" y2="84" stroke="#1e293b" stroke-dasharray="2 4" stroke-width="1"/>

  <!-- Main Market Pulse line -->
  <path d="M 20 72 L 38 72 L 46 54 L 54 84 L 66 36 L 76 76 L 86 62 L 108 62" 
        fill="none" 
        stroke="url(#pulseGrad)" 
        stroke-width="5" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#glow)"/>

  <!-- Soft Pulse Node Dots -->
  <circle cx="66" cy="36" r="4" fill="#34d399"/>
  <circle cx="108" cy="62" r="4" fill="#818cf8"/>
</svg>
