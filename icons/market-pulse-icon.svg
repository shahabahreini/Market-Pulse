<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <title>Market Pulse</title>
  <defs>
    <linearGradient id="ring" x1="14%" y1="88%" x2="88%" y2="10%">
      <stop offset="0%" stop-color="#3f7d6e"/>
      <stop offset="38%" stop-color="#5aa08c"/>
      <stop offset="70%" stop-color="#7cb9c6"/>
      <stop offset="100%" stop-color="#a8c6d4"/>
    </linearGradient>
    <linearGradient id="trace" x1="10%" y1="50%" x2="92%" y2="50%">
      <stop offset="0%" stop-color="#5aa08c"/>
      <stop offset="55%" stop-color="#4f9a8e"/>
      <stop offset="100%" stop-color="#6fb2b8"/>
    </linearGradient>
  </defs>

  <g fill="none" stroke-linecap="round">
    <!-- Brush ring, drawn as three passes of decreasing weight -->
    <path d="M 97.7 35.7 A 44 44 0 1 0 105.3 79.0"
          stroke="url(#ring)" stroke-width="13" opacity="0.92"/>
    <path d="M 101.5 31.4 A 48 48 0 1 0 108.6 80.4"
          stroke="url(#ring)" stroke-width="4" opacity="0.34"/>
    <path d="M 93.9 40.0 A 40 40 0 1 0 100.9 77.7"
          stroke="url(#ring)" stroke-width="2.5" opacity="0.28"/>

    <!-- Pulse trace -->
    <path d="M 14 74 C 24 74 28 67 37 67 C 45 67 47 77 55 77 L 61 77 L 67 43
             L 72 90 L 77 58 L 82 77 L 91 77 C 99 77 101 73 107 73"
          stroke="url(#trace)" stroke-width="3.6" stroke-linejoin="round"/>
  </g>

  <circle cx="113.5" cy="72.8" r="5.4" fill="#6fb2b8"/>

  <g fill="#5aa08c">
    <circle cx="26" cy="99" r="2.1" opacity="0.5"/>
    <circle cx="33" cy="106" r="1.4" opacity="0.4"/>
    <circle cx="41" cy="102" r="1.1" opacity="0.32"/>
    <circle cx="30" cy="93" r="1" opacity="0.3"/>
    <circle cx="46" cy="109" r="1.7" opacity="0.26"/>
  </g>
</svg>
